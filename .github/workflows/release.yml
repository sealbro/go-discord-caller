name: Dockerfile build/push

on:
  push:
    tags:
    - '*.*.*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.tag.outputs.stable }}
    steps:
    -
      name: Validate tag
      id: tag
      env:
        TAG: ${{ github.ref_name }}
      run: |
        if ! printf '%s' "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'; then
          echo "Tag is not a semantic version: refusing to release" >&2
          exit 1
        fi
        if printf '%s' "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "stable=true" >> "$GITHUB_OUTPUT"
        else
          echo "stable=false" >> "$GITHUB_OUTPUT"
        fi

  build:
    needs: validate
    uses: ./.github/workflows/build.yml

  secrets:
    needs: validate
    uses: ./.github/workflows/secrets.yml

  release:
    needs: [validate, build, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
      STABLE: ${{ needs.validate.outputs.stable }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
    -
      name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    -
      name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    -
      name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    -
      name: Set env
      run: |
        image="${DOCKERHUB_USERNAME}/go-discord-caller"
        tags="${image}:${RELEASE_VERSION}"
        if [ "$STABLE" = "true" ]; then
          tags="${tags},${image}:latest"
        fi
        {
          echo "GO_VERSION=$(grep -m1 '^go ' go.mod | awk '{print $2}' | cut -d. -f1,2)"
          echo "IMAGE_TAGS=${tags}"
        } >> "$GITHUB_ENV"
    -
      name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        build-args: |
          GO_VERSION=${{ env.GO_VERSION }}
          VERSION=${{ env.RELEASE_VERSION }}
        push: true
        tags: ${{ env.IMAGE_TAGS }}
    -
      name: Extract changelog for release
      id: changelog
      env:
        REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      run: |
        version="$RELEASE_VERSION"
        notes=$(awk -v v="$version" 'index($0, "## [" v "]") == 1 {found=1; next} found && /^## \[/ {exit} found {print}' CHANGELOG.md)
        notes=$(printf '%s\n' "$notes" | sed -e 's/^[[:space:]]*$//' -e '/./,$!d')
        previous=$(git describe --tags --abbrev=0 "${version}^" 2>/dev/null || true)
        if [ -n "$previous" ]; then
          full_changelog="**Full Changelog**: ${REPO_URL}/compare/${previous}...${version}"
        else
          full_changelog="**Full Changelog**: ${REPO_URL}/commits/${version}"
        fi
        {
          echo "notes<<EOF"
          echo "$notes"
          echo ""
          echo "$full_changelog"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
    -
      name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ env.RELEASE_VERSION }}
        name: ${{ env.RELEASE_VERSION }}
        body: ${{ steps.changelog.outputs.notes }}
        prerelease: ${{ env.STABLE != 'true' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
